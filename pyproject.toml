
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "my-trading-simulator"
version = "0.1.0"
description = "Paper trading simulator using Discord signals and Schwab market data"
requires-python = ">=3.11"

dependencies = [
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.0,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-dotenv>=1.0,<2",
    "openai>=2.0,<3",
    "boto3>=1.35,<2",
    "schwab-py>=1.5,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "httpx>=0.27,<1",
]

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
